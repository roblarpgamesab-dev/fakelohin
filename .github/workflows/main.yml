name: Build Geode Mod

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win
            os: windows-latest
          - platform: android64
            os: ubuntu-latest
          - platform: android32
            os: ubuntu-latest
          - platform: mac
            os: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          platform: ${{ matrix.platform }}

  package:
    name: Package Combined .geode
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - name: Merge Artifacts
        uses: geode-sdk/build-geode-mod/merge@main

  release:
    name: Publish Beta Release
    runs-on: ubuntu-latest
    needs: ['package']
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download Combined Artifact
        uses: actions/download-artifact@v4
        with:
          name: Build Output
          path: ./release-files

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }} (Beta Pre-Release)"
          files: ./release-files/*.geode
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') }}
          generate_release_notes: true
          body: |
            ### Beta Pre-Release Build
            This is a beta test build for **Geode v6.0.0** and **Geometry Dash 2.2091**.
            
            #### How to Install
            1. Download the `.geode` file below.
            2. Open Geometry Dash -> **Geode** -> **Installed** -> **Install from File** (or drop it into `geode/mods/`).
            3. Restart the game.
